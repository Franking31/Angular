<div class="login-container">
    <form class="login-form" (ngSubmit)="loginUser()">
      <h2>Connexion</h2>
  
      <input type="email" placeholder="Email" [(ngModel)]="loginData.email" name="email" required />
      <input type="password" placeholder="Mot de passe" [(ngModel)]="loginData.password" name="password" required />
  
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
  
      <p class="message" [ngClass]="{ 'success': message.includes('réussie'), 'error': message.includes('invalides') }">
        {{ message }}
      </p>
    </form>
  </div>
